[package]
name = "rustv1"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
anyhow = "1"
axum = "0.8"
candle-core = "0.9"
candle-nn = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Avoid the default oniguruma dependency. Verify tokenizer compatibility.
tokenizers = {
    version = "0.21",
    default-features = false,
    features = ["fancy-regex"]
}

# Benchmark client, HTTP only.
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = {
    version = "0.1",
    features = ["client", "client-legacy", "http1", "tokio"]
}
